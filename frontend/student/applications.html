<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Applications – TalentHub</title>
  <link rel="stylesheet" href="/static/css/styles.css">
  <link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body>

  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <img src="/static/assets/logo.svg" alt="TalentHub">
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section-title">Main Portal</div>
        <a href="/student/dashboard.html" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          Dashboard
        </a>
        <a href="/student/jobs.html" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
          Available Jobs
        </a>
        <a href="/student/applications.html" class="nav-item active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          My Applications
        </a>
        <a href="/student/interviews.html" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          Interviews
        </a>
        <a href="/student/offers.html" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="20 6 9 17 4 12"/></svg>
          Offers
        </a>

        <div class="nav-section-title" style="margin-top: 1rem;">Account</div>
        <a href="/student/profile.html" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          My Academic Profile
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-snippet">
          <div class="user-avatar">S</div>
          <div class="user-info">
            <div class="user-name">Loading...</div>
            <div class="user-role">Student Candidate</div>
          </div>
        </div>
      </div>
    </aside>

    <div class="main-wrapper">
      <header class="topbar">
        <div class="topbar-left">
          <button class="btn-sidebar-toggle">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <div class="page-title">Submitted Applications Track</div>
        </div>
        <div class="topbar-right">
          <span class="season-badge">Season 2026-2027</span>
          <button class="btn btn-secondary btn-sm btn-logout">Sign Out</button>
        </div>
      </header>

      <main class="content-body">
        <div class="table-controls">
          <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="app-search" class="form-control" placeholder="Search by role or company name...">
          </div>
          <div class="filter-group">
            <select id="filter-status" class="form-control" style="width: auto;">
              <option value="all">All Statuses</option>
              <option value="APPLIED">Applied</option>
              <option value="SHORTLISTED">Shortlisted</option>
              <option value="INTERVIEW_SCHEDULED">Interview Scheduled</option>
              <option value="INTERVIEWED">Interviewed</option>
              <option value="OFFERED">Offer Issued</option>
              <option value="ACCEPTED">Offer Accepted</option>
              <option value="REJECTED">Rejected</option>
            </select>
          </div>
        </div>

        <div class="card">
          <div class="card-body" style="padding: 0;">
            <div class="table-responsive">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>Company Name</th>
                    <th>Job Role</th>
                    <th>Package (CTC)</th>
                    <th>Applied Date</th>
                    <th>Current Status</th>
                    <th>Outcome / Notes</th>
                  </tr>
                </thead>
                <tbody id="applications-tbody">
                  <tr><td colspan="6" class="empty-state">Loading your application submissions...</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/main.js"></script>
  <script>
    let myApplications = [];

    document.addEventListener('DOMContentLoaded', async () => {
      const user = requireAuth(['student']);
      if (!user) return;
      initUserNavbar();

      await loadApplications();

      document.getElementById('app-search').addEventListener('input', renderApplications);
      document.getElementById('filter-status').addEventListener('change', renderApplications);
    });

    async function loadApplications() {
      try {
        myApplications = await apiFetch('/applications/me');
        renderApplications();
      } catch (err) {
        document.getElementById('applications-tbody').innerHTML = `
          <tr><td colspan="6" class="empty-state">Failed to load applications: ${err.message}</td></tr>
        `;
      }
    }

    function renderApplications() {
      const query = document.getElementById('app-search').value.toLowerCase().trim();
      const statusFilter = document.getElementById('filter-status').value;
      const tbody = document.getElementById('applications-tbody');

      let filtered = myApplications.filter(app => {
        const job = app.job || {};
        const matchesQuery = 
          (job.role && job.role.toLowerCase().includes(query)) ||
          (job.company_name && job.company_name.toLowerCase().includes(query));

        if (!matchesQuery) return false;
        if (statusFilter !== 'all' && app.status !== statusFilter) return false;
        return true;
      });

      if (filtered.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="6" class="empty-state">
              <h4>No applications found</h4>
              <p>Explore open recruitment drives to submit applications.</p>
              <a href="/student/jobs.html" class="btn btn-primary btn-sm" style="margin-top:0.75rem;">Browse Available Jobs</a>
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = filtered.map(app => {
        const job = app.job || {};
        let notesText = app.ineligibility_reason ? `<span class="text-xs text-danger font-medium">${app.ineligibility_reason}</span>` : '—';

        if (app.status === 'SHORTLISTED') {
          notesText = '<span class="text-xs text-primary font-medium">Eligible & Shortlisted for Interview Round 1</span>';
        } else if (app.status === 'ACCEPTED') {
          notesText = '<span class="text-xs text-success font-bold">Offer Confirmed & Accepted ✓</span>';
        } else if (app.status === 'OFFERED') {
          notesText = '<a href="/student/offers.html" class="text-xs text-success font-bold">Review Offer Letter &rarr;</a>';
        } else if (app.status === 'INTERVIEW_SCHEDULED') {
          notesText = '<a href="/student/interviews.html" class="text-xs text-primary font-medium">View Interview Venue &rarr;</a>';
        }

        return `
          <tr>
            <td class="font-bold">${job.company_name || 'Partner Company'}</td>
            <td>
              <div class="font-bold">${job.role || '—'}</div>
              <div class="text-xs text-muted">Drive Date: ${job.drive_date || '—'}</div>
            </td>
            <td class="font-bold text-success">${formatLPA(job.package_lpa)}</td>
            <td class="text-sm">${formatDate(app.applied_at)}</td>
            <td>${getStatusBadge(app.status)}</td>
            <td>${notesText}</td>
          </tr>
        `;
      }).join('');
    }
  </script>
</body>
</html>
